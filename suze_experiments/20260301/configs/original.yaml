# model
model_path: "Qwen/Qwen3-4B"
tensor_parallel_size: 1

# vllm server
max_model_len: 32768
gpu_memory_utilization: 0.85
enable_prefix_caching: true
enable_chunked_prefill: true
dtype: "auto"
max_num_batched_tokens: 2048

# dataset
num_samples: 30
seed: 42
shuffle: true

# hints
hint_fraction: 0.3
hint_type: "solution"
solver_type: "intext"         # "intext" or "prefill"
mode: "masked"                # "masked" or "sequential"
mask_token: "[MASK]"
stop_string: "ANSWER:"
hint_prefix: "Here is part of a hint that may be helpful to your solution:\n"

# generation
max_tokens: 8192
timeout: 1200
temperature: 0.6
top_p: 0.95
top_k: 20
presence_penalty: 1.0

# eval orchestrator
max_connections: 16
epochs: 1
max_retries: 3
retry_on_error: 3
fail_on_error: false
display: "plain"

# output
log_dir: "suze_experiments/20260301/logs"
